<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <title>Watch This Man</title>
    <style>
      :root {
        --green: #14f195;
        --purple: #9945ff;
        --ink: #f7f7f2;
        --muted: #aab5c8;
        --panel: #0b111d;
        --line: #273247;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1350px;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          radial-gradient(circle at 78% 24%, rgba(153, 69, 255, 0.35), transparent 32%),
          radial-gradient(circle at 18% 72%, rgba(20, 241, 149, 0.22), transparent 28%),
          #070a0f;
        background-size: 72px 72px, 72px 72px, auto, auto, auto;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .canvas {
        position: relative;
        width: 1080px;
        height: 1350px;
        padding: 72px;
      }

      .rail {
        position: absolute;
        inset: 0 auto 0 0;
        width: 14px;
        background: linear-gradient(180deg, var(--green), var(--purple));
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 22px;
        border: 1px solid rgba(20, 241, 149, 0.42);
        border-radius: 999px;
        background: rgba(11, 17, 29, 0.82);
        color: var(--green);
        font-size: 22px;
        font-weight: 950;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        width: 760px;
        margin: 54px 0 0;
        font-size: 156px;
        line-height: 0.86;
        letter-spacing: 0;
      }

      h1 span {
        display: block;
      }

      .subline {
        width: 620px;
        margin: 32px 0 0;
        color: var(--muted);
        font-size: 32px;
        font-weight: 680;
        line-height: 1.22;
      }

      .proof {
        position: absolute;
        top: 86px;
        right: 72px;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        color: var(--green);
        font-size: 22px;
        font-weight: 950;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .shot-wrap {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 128px;
        height: 520px;
        border: 1px solid var(--line);
        border-radius: 34px;
        background: rgba(11, 17, 29, 0.92);
        box-shadow: 0 40px 110px rgba(0, 0, 0, 0.58);
        overflow: hidden;
      }

      .shot-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          linear-gradient(180deg, transparent 34%, rgba(7, 10, 15, 0.14)),
          linear-gradient(90deg, rgba(20, 241, 149, 0.12), transparent 35%, rgba(153, 69, 255, 0.14));
        pointer-events: none;
      }

      .shot {
        position: absolute;
        left: -26px;
        top: -82px;
        width: 1060px;
        height: auto;
      }

      .stamp {
        position: absolute;
        right: 108px;
        bottom: 92px;
        z-index: 3;
        display: grid;
        gap: 8px;
        min-width: 292px;
        padding: 22px;
        border: 1px solid rgba(20, 241, 149, 0.5);
        border-radius: 24px;
        background: rgba(7, 10, 15, 0.88);
      }

      .stamp span {
        color: var(--muted);
        font-size: 18px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .stamp strong {
        color: var(--green);
        font-size: 40px;
        line-height: 0.95;
      }

      .footer {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 54px;
        display: flex;
        justify-content: space-between;
        gap: 24px;
        color: var(--muted);
        font-size: 24px;
        font-weight: 800;
      }

      .footer strong {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="rail"></div>
      <div class="chip">Solana Hustle Culture MVP</div>
      <div class="proof">Built with Codex</div>
      <h1>
        <span>WATCH</span>
        <span>THIS</span>
        <span>MAN</span>
      </h1>
      <p class="subline">
        From bounty brief to live MVP: Figma, site, screenshots, GitHub, deployment.
      </p>

      <section class="shot-wrap" aria-label="MVP screenshot">
        <img class="shot" src="watch-this-man-desktop.png" alt="Solana Hustle Culture MVP website screenshot" />
      </section>

      <div class="stamp">
        <span>Proof status</span>
        <strong>LIVE<br />NOW</strong>
      </div>

      <footer class="footer">
        <span><strong>No wallet.</strong> No trading. Just proof.</span>
        <span>rayaneutk-droid.github.io</span>
      </footer>
    </main>
  </body>
</html>
